services:
  mysql:
    image: mysql:8.4
    container_name: vectasheet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 0808
      MYSQL_DATABASE: vectasheet
    ports:
      - "3306:3306"
    volumes:
      - vectasheet-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vectasheet-mysql-data:
